# dsh-usage-hub bundle patch: adds the aggregated subscription usage reading.
#
# `deepseek.apiKeyEnv` names the credential the balance call authenticates with;
# it is resolved through the harness credential store first and the process
# environment second.
#
# `opencode.mode`: `auto` (default) uses the Go API key against the gateway and
# falls back to a local OpenCode server; `api` uses only the API key, so no
# OpenCode app is needed; `server` uses only a local server (`opencode.baseUrl`
# + `opencode.password` when attaching to a running one, otherwise the CLI named
# by `opencode.cliPath`, empty: auto-detected install).
- insert:
    - id: usage-hub
      name: 'dsh-usage-hub'
      config:
        cacheTtlMs: 300000
        # How outgoing reads reach the network: `system` (HTTPS_PROXY/ALL_PROXY,
        # then the Windows per-user proxy), '' for a direct connection, or an
        # explicit proxy URL such as http://127.0.0.1:7890. Loopback targets
        # (a local OpenCode server) always go direct.
        proxy: system
        deepseek:
          enabled: true
          apiKeyEnv: DEEPSEEK_API_KEY
          baseUrl: 'https://api.deepseek.com'
        opencode:
          enabled: true
          mode: auto
          apiKeyEnv: OPENCODE_GO_API_KEY
          # Second source when that reference is unset: the record the pi-ai
          # adapter writes when the provider is signed in through its own flow.
          credentialRecord: 'llm-pi-ai/opencode-go'
          apiBaseUrl: 'https://opencode.ai/zen/go/v1'
          cliPath: ''
          baseUrl: ''
          password: ''
          startTimeoutMs: 25000
        codex:
          enabled: true
          # Empty: $CODEX_HOME/auth.json, else ~/.codex/auth.json. Codex signs in
          # through ChatGPT, so this file is the only source of its allowance.
          authPath: ''
          baseUrl: 'https://chatgpt.com/backend-api'
        zai:
          enabled: true
          # GLM Coding Plan key; empty/unset means no GLM reading at all.
          apiKeyEnv: ZAI_API_KEY
          # https://open.bigmodel.cn for the CN region.
          baseUrl: 'https://api.z.ai'
